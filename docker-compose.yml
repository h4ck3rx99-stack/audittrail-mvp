# Local infrastructure for AuditTrail development and tests.
# Postgres is published on host port 5433 to avoid clashing with a locally installed Postgres on 5432.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: audittrail
      POSTGRES_PASSWORD: audittrail
      POSTGRES_DB: audittrail
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audittrail -d audittrail"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Optional S3-compatible storage for exercising the s3 driver locally:
  #   docker compose --profile minio up -d
  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: audittrail
      MINIO_ROOT_PASSWORD: audittrail-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
