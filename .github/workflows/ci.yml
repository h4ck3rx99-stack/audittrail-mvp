name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: audittrail
          POSTGRES_PASSWORD: audittrail
          POSTGRES_DB: audittrail
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U audittrail -d audittrail"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DEPLOYMENT_ENV: local
      DATABASE_URL: postgresql://audittrail:audittrail@localhost:5432/audittrail
      DATABASE_URL_TEST: postgresql://audittrail:audittrail@localhost:5432/audittrail_test
      AUTH_SECRET: ci-only-auth-secret-0123456789-abcdefghijklmnop
      APP_URL: http://localhost:3000
      CRON_SECRET: ci-only-cron-secret-0123456789
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: ./storage
      EMAIL_DRIVER: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use the public npm registry
        run: npm config set registry https://registry.npmjs.org/ --location=project
      - run: npm ci
      - name: Create the test database
        run: PGPASSWORD=audittrail psql -h localhost -U audittrail -d audittrail -c "CREATE DATABASE audittrail_test"
      - run: npm run lint
      - run: npm run typecheck
      - name: Migrate
        run: npm run db:deploy && npm run catalog:sync
      - run: npm test
      - run: npm run build
      - name: Seed demo data
        run: npm run db:seed
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=critical
